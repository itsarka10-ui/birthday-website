<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise - 3D Balloons</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #f7dfe7 0%, #fce4ec 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Arial", sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: linear-gradient(to bottom, #f7dfe7 0%, #ffe0e6 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(111, 61, 76, 0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .tap-message {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #9d4d61;
      font-weight: 600;
      text-align: center;
      animation: pulse 2s ease-in-out infinite;
      z-index: 10;
      pointer-events: none;
    }

    .tap-message.hidden {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.05); opacity: 0.8; }
    }

    .title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: 700;
      color: #9d4d61;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
    }

    .instruction {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #b8738a;
      z-index: 10;
      text-align: center;
      max-width: 300px;
    }

    @media (max-width: 768px) {
      #canvas-container {
        height: 500px;
      }

      .title {
        font-size: 22px;
      }

      .tap-message {
        font-size: 16px;
        bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div class="title">Happy Birthday!</div>
    <div class="instruction">Tap the cork to release the balloons</div>
    <div class="tap-message" id="tapMessage">👆 TAP THE CORK 👆</div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTFLoader for loading .glb models -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.min.js"></script>

  <script>
    // Scene setup
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0xf7dfe7, 1);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    camera.position.z = 3;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight.position.set(2, 3, 2);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Store for balloon data
    let balloons = [];
    let cork = null;
    let isAnimating = false;
    let animationProgress = 0;

    // Create balloon function
    function createBalloon(x, y, z, color) {
      const geometry = new THREE.SphereGeometry(0.25, 32, 32);
      
      // Create material based on color
      let material;
      switch (color) {
        case "red":
          material = new THREE.MeshStandardMaterial({
            color: 0xff6e75,
            roughness: 0.2,
            metalness: 0.1,
            emissive: 0x330000
          });
          break;
        case "blue":
          material = new THREE.MeshStandardMaterial({
            color: 0x1e8ad9,
            roughness: 0.2,
            metalness: 0.1,
            emissive: 0x001a33
          });
          break;
        case "yellow":
          material = new THREE.MeshStandardMaterial({
            color: 0xf7c948,
            roughness: 0.2,
            metalness: 0.1,
            emissive: 0x332200
          });
          break;
      }

      const balloon = new THREE.Mesh(geometry, material);
      balloon.position.set(x, y, z);
      balloon.castShadow = true;
      balloon.receiveShadow = true;

      // Add string
      const stringGeometry = new THREE.BufferGeometry();
      const stringPoints = [
        new THREE.Vector3(0, -0.25, 0),
        new THREE.Vector3(0.05, -0.8, 0),
        new THREE.Vector3(0, -1.2, 0)
      ];
      stringGeometry.setFromPoints(stringPoints);
      const stringMaterial = new THREE.LineBasicMaterial({ color: 0x999999, linewidth: 2 });
      const string = new THREE.Line(stringGeometry, stringMaterial);

      balloon.add(string);

      // Store original position and animation data
      balloon.userData = {
        originalPosition: new THREE.Vector3(x, y, z),
        endPosition: new THREE.Vector3(
          x + (Math.random() - 0.5) * 2,
          y + 3.5,
          z + (Math.random() - 0.5) * 0.5
        ),
        delay: Math.random() * 0.3,
        rotation: new THREE.Euler(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        ),
        sway: Math.random() * 0.1
      };

      scene.add(balloon);
      return balloon;
    }

    // Create cork stopper function
    function createCork() {
      const group = new THREE.Group();

      // Main cork body
      const corkGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.25, 16);
      const corkMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b5527,
        roughness: 0.7,
        metalness: 0,
      });
      const corkBody = new THREE.Mesh(corkGeometry, corkMaterial);
      corkBody.castShadow = true;
      corkBody.receiveShadow = true;
      group.add(corkBody);

      // Cork top cap
      const capGeometry = new THREE.CylinderGeometry(0.14, 0.12, 0.08, 16);
      const capMaterial = new THREE.MeshStandardMaterial({
        color: 0x9d6534,
        roughness: 0.6,
        metalness: 0.1,
      });
      const cap = new THREE.Mesh(capGeometry, capMaterial);
      cap.position.y = 0.165;
      cap.castShadow = true;
      cap.receiveShadow = true;
      group.add(cap);

      group.position.set(0, -0.5, 0);
      group.userData = {
        originalPosition: group.position.clone(),
        isClickable: true
      };

      scene.add(group);
      return group;
    }

    // Create balloons
    balloons.push(createBalloon(-0.5, 0.2, 0, "red"));
    balloons.push(createBalloon(0.3, 0.5, -0.1, "blue"));
    balloons.push(createBalloon(-0.2, 0.8, 0.1, "yellow"));
    balloons.push(createBalloon(0.6, 0.3, 0, "red"));
    balloons.push(createBalloon(-0.7, 0.6, -0.1, "blue"));
    balloons.push(createBalloon(0.1, 1.0, 0.1, "yellow"));

    // Create cork
    cork = createCork();

    // Raycaster for mouse/touch detection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Handle click/tap
    function onTap(event) {
      if (isAnimating) return;

      // Get mouse position
      const rect = container.getBoundingClientRect();
      mouse.x = ((event.clientX || event.touches[0].clientX) - rect.left) / rect.width * 2 - 1;
      mouse.y = -((event.clientY || event.touches[0].clientY) - rect.top) / rect.height * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Check if cork was clicked
      const intersects = raycaster.intersectObjects(cork.children, true);

      if (intersects.length > 0) {
        startBalloonAnimation();
      }
    }

    container.addEventListener("click", onTap);
    container.addEventListener("touchstart", onTap);

    // Animation function
    function startBalloonAnimation() {
      isAnimating = true;
      animationProgress = 0;
      document.getElementById("tapMessage").classList.add("hidden");

      // Animate cork pop
      cork.rotation.z = -0.3;
      cork.position.y = -0.3;
    }

    // Idle sway animation
    let time = 0;
    function animateSway() {
      if (isAnimating) return;

      balloons.forEach((balloon) => {
        balloon.position.y = balloon.userData.originalPosition.y + Math.sin(time * 1.5) * 0.05;
        balloon.rotation.z = Math.sin(time * 0.8) * 0.1;
      });

      time += 0.016;
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      if (isAnimating) {
        animationProgress += 0.01; // Adjust speed here

        if (animationProgress <= 1) {
          balloons.forEach((balloon) => {
            const delayedProgress = Math.max(0, animationProgress - balloon.userData.delay);
            
            if (delayedProgress > 0) {
              // Easing function (ease-out)
              const easeProgress = 1 - Math.pow(1 - Math.min(delayedProgress, 1), 3);

              // Interpolate position
              balloon.position.lerpVectors(
                balloon.userData.originalPosition,
                balloon.userData.endPosition,
                easeProgress
              );

              // Add rotation
              balloon.rotation.copy(balloon.userData.rotation);
              balloon.rotation.z += easeProgress * Math.PI;

              // Fade out
              balloon.material.opacity = 1 - easeProgress * 0.5;
            }
          });
        } else {
          isAnimating = false;
          // Reset for replay
          setTimeout(() => {
            balloons.forEach((balloon) => {
              balloon.position.copy(balloon.userData.originalPosition);
              balloon.rotation.set(0, 0, 0);
              balloon.material.opacity = 1;
            });
            cork.rotation.z = 0;
            cork.position.y = -0.5;
            document.getElementById("tapMessage").classList.remove("hidden");
          }, 1000);
        }
      } else {
        animateSway();
      }

      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener("resize", () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    animate();
  </script>
</body>
</html>
